name: 'Docker: SBOM manifest-format probe'
run-name: "Docker: SBOM probe (sbom=${{ inputs.sbom }})"

# Publishes n8n to a scratch GHCR tag and asserts the merged manifest is still
# an OCI image index. Exists because 2.26.0 shipped as a Docker manifest list
# and failed to pull on AKS (#31997); `sbom: true` was restored to force the
# index format. Run this before changing that flag, and after a buildx,
# BuildKit or base-image bump.
#
# Touches no published tag. The scratch tag is left in place so a preview
# deploy can pull it on a real cluster - the 2.26.0 failure was a consumer-side
# containerd bug, so matching media types is necessary but not sufficient.

on:
  workflow_dispatch:
    inputs:
      sbom:
        description: 'Build with SBOM attestations (true reproduces the current release path)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '26.7.0'
  SCRATCH_TAG: sbom-probe-${{ github.run_id }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: blacksmith-4vcpu-ubuntu-2204
          - platform: arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: pnpm build:n8n
          enable-docker-cache: 'true'
          docker-cache-key: n8n-io/n8n

      - name: Login to GHCR
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'

      - name: Build and push scratch image
        env:
          PLATFORMS: linux/${{ matrix.platform }}
          N8N_TAGS: ghcr.io/${{ github.repository }}:${{ env.SCRATCH_TAG }}-${{ matrix.platform }}
          SBOM: ${{ inputs.sbom }}
        run: |
          # oci-mediatypes is what keeps the merged manifest an OCI index once
          # the SBOM attestations are gone; imagetools inherits the source type.
          if [ "$SBOM" = 'true' ]; then
            OUT=(--push)
          else
            OUT=(--set '*.output=type=image,oci-mediatypes=true,push=true')
          fi
          docker buildx bake -f docker/docker-bake.hcl n8n \
            --provenance=false \
            --sbom="$SBOM" \
            "${OUT[@]}"

  verify:
    name: Merge and verify manifest format
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'

      # Same imagetools merge the release path uses, so the media type this
      # asserts is the one a release would publish.
      - name: Merge per-arch manifests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${SCRATCH_TAG}" \
            "${IMAGE}:${SCRATCH_TAG}-amd64" \
            "${IMAGE}:${SCRATCH_TAG}-arm64"

      - name: Assert OCI image index
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          node .github/scripts/docker/assert-manifest-format.mjs \
            "${IMAGE}:${SCRATCH_TAG}" --expect-platforms 2

      - name: Report scratch tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          {
            echo "### SBOM probe (sbom=${{ inputs.sbom }})"
            echo
            echo 'Pull for a preview deploy:'
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${SCRATCH_TAG}"
            echo '```'
            echo
            echo 'Media types match only proves the producer side. The 2.26.0'
            echo 'failure was a containerd bug, so verify a real pull too.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Media type is a property of the exporter, not the image contents, so this
  # answers "which exporter flags yield an OCI index" against the real CI
  # buildkitd in ~2 minutes instead of a 25-minute n8n build.
  format-matrix:
    name: Exporter format matrix (${{ matrix.name }})
    runs-on: blacksmith-4vcpu-ubuntu-2204
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Negative control: proves the check can still detect the 2.26.0 format.
          - name: sbom-off
            sbom: 'false'
            oci_mediatypes: 'false'
            expect_fail: 'true'
          - name: sbom-off-oci-mediatypes
            sbom: 'false'
            oci_mediatypes: 'true'
          - name: sbom-on
            sbom: 'true'
            oci_mediatypes: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
        with:
          cache-key: n8n-io/n8n

      - name: Login to GHCR
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'

      - name: Build both arches and merge
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: fmt-${{ github.run_id }}-${{ matrix.name }}
          SBOM: ${{ matrix.sbom }}
          OCI_MEDIATYPES: ${{ matrix.oci_mediatypes }}
        run: |
          mkdir -p /tmp/fmt && printf 'FROM alpine:3.22\nRUN echo hi > /hi\n' > /tmp/fmt/Dockerfile
          for arch in amd64 arm64; do
            REF="${IMAGE}:${TAG}-${arch}"
            # oci-mediatypes lives on the exporter, so that variant has to go
            # through --output rather than -t/--push.
            if [ "$OCI_MEDIATYPES" = 'true' ]; then
              OUT=(--output "type=image,name=${REF},oci-mediatypes=true,push=true")
            else
              OUT=(-t "${REF}" --push)
            fi
            docker buildx build /tmp/fmt \
              --platform "linux/${arch}" --provenance=false "--sbom=${SBOM}" \
              "${OUT[@]}"
          done
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"

      - name: Report merged format
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: fmt-${{ github.run_id }}-${{ matrix.name }}
          EXPECT_FAIL: ${{ matrix.expect_fail }}
        run: |
          set -o pipefail
          rc=0
          node .github/scripts/docker/assert-manifest-format.mjs \
            "${IMAGE}:${TAG}" --expect-platforms 2 | tee /tmp/out.txt || rc=$?
          if [ "$EXPECT_FAIL" = 'true' ]; then
            if [ "$rc" -eq 0 ]; then
              echo "::error::negative control passed - the check no longer detects a Docker manifest list"
              exit 1
            fi
            echo "control produced the wrong format, as expected"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
